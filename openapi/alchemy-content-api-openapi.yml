  /llms.txt:
    get:
      operationId: getLlmsTxt
      summary: Curated site index
      description: Every page on the site, grouped by section, one line each with a title, URL and one-sentence description. Long sections are split into `//llms.txt` files linked from here. Follows the llmstxt.org convention.
      tags:
      - Content
      responses:
        '200':
          description: The index.
          content:
            text/plain:
              schema:
                type: string
  /llms-full.txt:
    get:
      operationId: getLlmsFullTxt
      summary: Whole site in one file
      description: Every page body concatenated into a single file. Large; prefer `/llms.txt` plus per-page `.md` fetches unless you genuinely want everything.
      tags:
