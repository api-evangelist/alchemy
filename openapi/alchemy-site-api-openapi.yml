openapi: 3.2.0
info:
  title: Alchemy website Site API
  version: 1.0.0
  summary: Public endpoints and markdown representations served by www.alchemy.com.
  description: 'Public HTTP surface of www.alchemy.com, plus the rules for reading the site as markdown instead of HTML.


    ## Reading the site as markdown


    Every page under `/blog/`, `/overviews/`, `/case-studies/`, `/support/`, `/terms-conditions/`, `/rpc/` has a markdown twin, and so does the homepage. Reach it either way:


    - **Append `.md`** to the path — `/blog/some-post.md`. One request, `200`, `text/markdown`.

    - **Send `Accept: text/markdown`** to the HTML URL. The response is a `307` to the `.md` URL and carries `Vary: Accept`.


    Curated indexes for crawling the whole site live at `/llms.txt` (grouped, one line per page) and `/llms-full.txt` (every page body in one file). Per-section indexes are at `//llms.txt`.


    ## Errors


    Endpoints under `/api/` answer with JSON on failure. Paths that match nothing return `404` with an `Error` body: a stable `code` to branch on, a human `message`, and a `hint` naming the next step. Older faucet endpoints additionally carry the legacy `error` and `statusCode` fields described on each operation; both shapes are stable.


    ## Rate limits


    The faucet endpoints are CAPTCHA-gated and rate limited per address and per network. Everything else described here is a read, most of it prerendered and served from the CDN, with no documented per-caller limit; cache it rather than re-fetching.'
  termsOfService: https://legal.alchemy.com/
  contact:
    name: Alchemy support
    url: https://www.alchemy.com/support
servers:
- url: https://www.alchemy.com
  description: Production
security: []
tags:
- name: Site
  description: Endpoints backing the website itself.
paths:
  /api/search/{locale}:
    get:
      operationId: getSiteSearchIndex
      summary: Site search index
      description: 'The full command-palette index for a locale: blog posts, guides, case studies and dapp listings, each with a title, description and URL. Prebuilt at deploy time and served from the CDN, so it is cheap to fetch whole and filter client-side. For a text index of the same content, prefer `/llms.txt`.'
      tags:
      - Site
      parameters:
      - name: locale
        in: path
        description: Content locale. The index is prerendered per locale, so only the listed values are served; anything else is a 404, not a fallback to English.
        required: true
        schema:
          type: string
          enum:
          - en
          - ja
          - es
          - ko
          - zh-Hans
          - zh-Hant
          - pt-BR
      responses:
        '200':
          description: Groups of search entries. Empty groups are omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchGroup'
        '404':
          description: Not one of the locales this index is built for.
  /api/ip:
    get:
      operationId: getClientIp
      summary: Echo the caller's IP
      description: Returns the IP address the CDN saw for this request. `null` when the edge did not supply one.
      tags:
      - Site
      responses:
        '200':
          description: The caller's IP address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ipAddress:
                    type:
                    - string
                    - 'null'
                    description: Client IP, or `null` if unavailable.
                required:
                - ipAddress
  /openapi.json:
    get:
      operationId: getOpenApiDocument
      summary: This document
      description: The OpenAPI description of this API. Also served at `/api/openapi.json`.
      tags:
      - Site
      responses:
        '200':
          description: An OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
  /api/{unmatchedPath}:
    get:
      operationId: getUnmatchedApiPath
      summary: Any /api path that does not exist
      description: 'Not an endpoint. Listed so the failure shape is discoverable: every request under `/api/` that matches no operation above answers `404` with an `Error` body rather than an HTML page, for any method. Read `error.code` to branch and `error.hint` for the next step.'
      tags:
      - Site
      parameters:
      - name: unmatchedPath
        in: path
        description: Any path under `/api/` with no operation.
        required: true
        schema:
          type: string
      responses:
        '404':
          description: No such endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      description: Structured failure. Branch on `error.code`; show `error.message`; act on `error.hint`.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable, machine-readable failure code.
              enum:
              - not_found
              - method_not_allowed
              - bad_request
              - internal_error
            message:
              type: string
              description: What went wrong, in one sentence.
            hint:
              type: string
              description: The concrete next step for the caller.
            status:
              type: integer
              description: HTTP status, repeated for convenience.
            documentation_url:
              type: string
              format: uri
              description: Where the callable surface is described.
          required:
          - code
          - message
          - hint
          - status
          - documentation_url
      required:
      - error
    SearchItem:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        url:
          type: string
          description: Site-relative for pages on this domain, absolute for dapp listings.
        icon:
          type: string
          description: Logo URL, when there is one.
        external:
          type: boolean
          description: '`true` when `url` leaves this domain.'
      required:
      - title
      - url
    SearchGroup:
      type: object
      properties:
        label:
          type: string
          description: Group heading, e.g. `Blog Posts`, `Guides`, `Case Studies`, `Apps`.
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchItem'
      required:
      - label
      - items
